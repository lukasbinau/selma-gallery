<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#230a66" />
    <title>Galleri · testside</title>
    <style>
      /* A stand-in for the front page behind the gallery. Add ?debug to the URL
         to draw rectAtRest()/currentRect() over the painting. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fcd23b;
        font-family: 'Space Mono', monospace;
        color: #230a66;
      }
      .front {
        padding: 32px;
      }
      .front button {
        font: inherit;
        padding: 10px 18px;
        border: 2px solid #230a66;
        border-radius: 999px;
        background: #f767d3;
        color: #230a66;
        cursor: pointer;
        margin: 4px;
      }
      .front p {
        max-width: 60ch;
      }
    </style>
  </head>
  <body>
    <div class="front">
      <h1>Galleri · testside</h1>
      <p>
        Galleriet åbner af sig selv. Når du trykker ← FORSIDE (eller Escape) lukker det, og knapperne herunder åbner det
        igen.
      </p>
      <div class="buttons"></div>
      <p class="log"></p>
    </div>
    <div id="galleri" hidden></div>
    <script type="module" src="/src/gallery/dev.js"></script>
  </body>
</html>
